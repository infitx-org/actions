name: Release Workflow
run-name: release-please => ${{  github.event.head_commit.message }}

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
    secrets:
      token:
        required: false
      REGISTRY_PASSWORD:
        required: true
      TRIGGER_DOWNSTREAM:
        required: false
      CHROMATIC_PROJECT_TOKEN:
        required: false

# The same payload as `rush.yaml`'s `CACHE_PATHS`, and it has to stay that way: both
# workflows write one key, `Linux-pnpm-<lockfile hash>`, so a different list here
# would hand the other workflow an archive it does not expect. The store travels as a
# single `deps.tar.zst` because a cache step pays per enumerated file — 209k files
# cost 41 minutes to write, one file takes seconds (@@F-522) — and the trees derived
# from the store are rebuilt by `rush install` in seconds, native build included
# (@@D-546). See that file for the reasoning; keep the two lists identical.
#
# No `*/dist` in the list on either side: the build output travels as the `build`
# artifact of the run, because a key that hashes the lockfile alone cannot invalidate
# on a source change and would hand `publish-package` the dist of an older commit
# (`@@F-555`).
env:
  CACHE_PATHS: |
    common/temp/deps.tar.zst
    app/*/.rush
    core/*/.rush
    realm/*/.rush
    suite/*/.rush
    demo/*/.rush
    test/*/.rush
    tools/*/.rush
    ext/*/.rush
    library/*/.rush
    docs/*/.rush

jobs:
  release:
    runs-on: ubuntu-26.04
    env:
      token: ${{ secrets.token }}
    outputs:
      docker: ${{ steps.docker.outputs.changes }}
      npm: ${{ steps.npm.outputs.changes }}
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for package.json
        id: check-package
        run: |
          if [ -f ./release-please-config.json ]; then
            echo "type=" >> $GITHUB_OUTPUT
          elif [ -f ./package.json ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          else
            echo "type=simple" >> $GITHUB_OUTPUT
          fi
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ env.token != '' }}
        with:
          token: ${{ env.token }}
          release-type: ${{ steps.check-package.outputs.type }}
      - name: Find Dockerfiles for released paths
        id: docker
        if: steps.release.outputs.releases_created == 'true'
        run: |
          shopt -s nullglob globstar extglob
          PACKAGES="["
          for path in ${{ join(fromJson(steps.release.outputs.paths_released), ' ') }}; do
            for file in $path/**/*Dockerfile; do
              PACKAGES="$PACKAGES{\"dockerfile\":\"$file\",\"image\":\"$(basename $file | cut -d'.' -f1)\",\"tags\":\"v$(jq -r ".[\"$path\"]" < .release-please-manifest.json)\"},"
            done
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT
      - name: Find NPM packages for released paths
        id: npm
        if: steps.release.outputs.releases_created == 'true'
        run: |
          shopt -s nullglob globstar extglob
          PACKAGES="["
          for path in ${{ join(fromJson(steps.release.outputs.paths_released), ' ') }}; do
            if [ -f "$path/package.json" ]; then
              VERSION=$(jq -r .version < "$path/package.json")
              NAME=$(jq -r .name < "$path/package.json")
              PUBLISH=$(jq -r '.scripts."ci-publish"' < "$path/package.json")
              if [ -z "$PUBLISH" ] || [ "$PUBLISH" == "false" ] || [ "$PUBLISH" == "null" ]; then
                continue
              fi
              PACKAGES="$PACKAGES{\"package\":\"$NAME\",\"path\":\"$path\"},"
            fi
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT

  publish-image:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.docker != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.release.outputs.docker) }}
    uses: ./.github/workflows/docker.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      tags: ${{ matrix.tags }}
      image: ${{ matrix.image }}
      license-scan: false
      downstream: https://api.github.com/repos/infitx-org/profile-cd/actions/workflows/docker-image.yaml/dispatches
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_DOWNSTREAM: ${{ secrets.TRIGGER_DOWNSTREAM }}

  setup-node:
    needs: release
    # This is the build job of a release, not only the npm gate: `chromatic` reads the
    # `build` artifact it packs, so it has to run whenever a release happened, including
    # a release whose `npm` list is empty (`publish-package` still decides what to
    # publish from that list).
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - &node
        name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - &cache
        name: cache pnpm store
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          # The same fallback as `rush.yaml`: a changed lockfile restores the newest archive and
          # downloads the difference, and an exact miss is still what this job saves under.
          restore-keys: ${{ runner.os }}-pnpm-
      - &unpack
        name: Unpack the pnpm store
        # The archive holds the store as one `deps.tar.zst`, so it has to be unpacked
        # before an install can use it. `zstd` piped into `tar` rather than `tar --zstd`,
        # so the step does not depend on how the runner's tar was built, and an archive
        # from an older key holds the tree instead — a missing tarball is not an error.
        run: |
          if [ -f common/temp/deps.tar.zst ]; then
            zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
          else
            echo 'No deps.tar.zst in the restored archive; the install builds the store.'
          fi
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
      - name: Pack the build output
        # The dist trees this job built, as one file, for the same reasons `rush.yaml`
        # packs them: an upload walks every path it is handed (@@F-522), and the cache
        # key cannot describe a source change (@@F-555). `publish-package` reads this
        # artifact, so what is published is the build of this run and not of whichever
        # commit first wrote the cache key.
        run: |
          set -euo pipefail
          shopt -s nullglob
          TREES=()
          for CATEGORY in app core realm suite demo test tools ext library; do
            [ -d "$CATEGORY" ] || continue
            for TREE in "$CATEGORY"/*/dist; do
              [ -d "$TREE" ] && TREES+=("$TREE")
            done
          done
          if [ "${#TREES[@]}" -eq 0 ]; then
            echo 'No project dist in this repository; packing an empty archive.'
            tar -cf - --files-from /dev/null | zstd -3 -T0 -q -f -o common/temp/build.tar.zst
          else
            printf '%s\n' "${TREES[@]}"
            tar -cf - "${TREES[@]}" | zstd -3 -T0 -q -f -o common/temp/build.tar.zst
          fi
          ls -l common/temp/build.tar.zst
      - name: Upload the build output
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: common/temp/build.tar.zst
      - name: Pack the pnpm store
        run: |
          if [ -d common/temp/pnpm-store ]; then
            tar -cf - common/temp/pnpm-store | zstd -3 -T0 -q -f -o common/temp/deps.tar.zst
            ls -l common/temp/deps.tar.zst
          else
            echo 'No pnpm store at common/temp/pnpm-store; nothing to pack.'
          fi

  publish-package:
    needs:
      - release
      - setup-node
    strategy:
      matrix:
        include: ${{ fromJson(needs.release.outputs.npm) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - *node
      # `&cache-restore` is the anchor the jobs that do not build use. Only a job
      # that runs `rush rebuild` may write the shared pnpm key. A job that only
      # installs and then saves wins the race with an archive of its own, and since
      # an exact cache hit suppresses saving, that archive is then handed to every
      # later run falling back to the default branch (@@F-309). The archive carries no
      # build output, so it can be stale without consequence: the dist comes from the
      # `build` artifact of the run (`@@F-555`).
      - &cache-restore
        name: cache pnpm store (restore only)
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
          # No `restore-keys` here, deliberately: `publish-package` must not publish a tree it
          # did not build, and its `Fail if cache not hit` guard means what it says, so this key
          # has to match exactly rather than fall back to an older archive.
      - name: Fail if cache not hit
        if: steps.cache.outputs.cache-hit != 'true'
        run: exit 1
      - *unpack
      # What this job publishes is the build `setup-node` made in this run — the
      # `build` artifact — rather than a dist that came back from the cache with the
      # store (`@@F-555`). The cache guard above still gates the install it needs.
      - &download-build
        name: Download the build output
        uses: actions/download-artifact@v8
        with:
          name: build
          path: common/temp
      - &unpack-build
        name: Unpack the build output
        run: |
          if [ -f common/temp/build.tar.zst ]; then
            zstd -dc common/temp/build.tar.zst | tar -xf - -C .
          else
            echo 'No build.tar.zst in the artifact; nothing to unpack.'
          fi
      - name: Run publish script ${{ matrix.package }}
        run: |
          node common/scripts/install-run-rush.js install
          cd ${{ matrix.path }}
          npm run ci-publish
        id: publish
      # optionally publish to GitHub Pages if the publish script outputs a pages path
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.publish.outputs.pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ matrix.path }}/${{steps.publish.outputs.pages}}

  chromatic:
    # The Storybook baseline is taken from the build of this release, which `setup-node`
    # makes and `publish-package` publishes, so it waits for it (`@@F-555`).
    needs: [release, setup-node]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: main
      CHROMATIC_SHA: ${{ github.sha }}
      CHROMATIC_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - *node
      # Restore only: this job never builds, so its filesystem must not become the
      # cache for a key the test jobs read (see the anchor in `publish-package`).
      - *cache-restore
      - *unpack
      - *download-build
      - *unpack-build
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Chromatic Storybook baseline
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: node common/scripts/install-run-rush.js ci-chromatic
