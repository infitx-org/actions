name: Release Workflow
run-name: release-please => ${{  github.event.head_commit.message }}

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
    secrets:
      token:
        required: false
      REGISTRY_PASSWORD:
        required: true
      TRIGGER_DOWNSTREAM:
        required: false
      CHROMATIC_PROJECT_TOKEN:
        required: false

# The same payload as `rush.yaml`'s `CACHE_PATHS`, and it has to stay that way: both
# workflows write one key, `Linux-pnpm-<lockfile hash>`, so a different list here
# would hand the other workflow an archive it does not expect. The store travels as a
# single `deps.tar.zst` because a cache step pays per enumerated file — 209k files
# cost 41 minutes to write, one file takes seconds (@@F-522) — and the trees derived
# from the store are rebuilt by `rush install` in seconds, native build included
# (@@D-546). See that file for the reasoning; keep the two lists identical.
env:
  CACHE_PATHS: |
    common/temp/deps.tar.zst
    app/*/dist
    app/*/.rush
    core/*/dist
    core/*/.rush
    realm/*/dist
    realm/*/.rush
    suite/*/dist
    suite/*/.rush
    demo/*/dist
    demo/*/.rush
    test/*/dist
    test/*/.rush
    tools/*/dist
    tools/*/.rush
    ext/*/dist
    ext/*/.rush
    library/*/dist
    library/*/.rush
    docs/*/.rush

jobs:
  release:
    runs-on: ubuntu-26.04
    env:
      token: ${{ secrets.token }}
    outputs:
      docker: ${{ steps.docker.outputs.changes }}
      npm: ${{ steps.npm.outputs.changes }}
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for package.json
        id: check-package
        run: |
          if [ -f ./release-please-config.json ]; then
            echo "type=" >> $GITHUB_OUTPUT
          elif [ -f ./package.json ]; then
            echo "type=node" >> $GITHUB_OUTPUT
          else
            echo "type=simple" >> $GITHUB_OUTPUT
          fi
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ env.token != '' }}
        with:
          token: ${{ env.token }}
          release-type: ${{ steps.check-package.outputs.type }}
      - name: Find Dockerfiles for released paths
        id: docker
        if: steps.release.outputs.releases_created == 'true'
        run: |
          shopt -s nullglob globstar extglob
          PACKAGES="["
          for path in ${{ join(fromJson(steps.release.outputs.paths_released), ' ') }}; do
            for file in $path/**/*Dockerfile; do
              PACKAGES="$PACKAGES{\"dockerfile\":\"$file\",\"image\":\"$(basename $file | cut -d'.' -f1)\",\"tags\":\"v$(jq -r ".[\"$path\"]" < .release-please-manifest.json)\"},"
            done
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT
      - name: Find NPM packages for released paths
        id: npm
        if: steps.release.outputs.releases_created == 'true'
        run: |
          shopt -s nullglob globstar extglob
          PACKAGES="["
          for path in ${{ join(fromJson(steps.release.outputs.paths_released), ' ') }}; do
            if [ -f "$path/package.json" ]; then
              VERSION=$(jq -r .version < "$path/package.json")
              NAME=$(jq -r .name < "$path/package.json")
              PUBLISH=$(jq -r '.scripts."ci-publish"' < "$path/package.json")
              if [ -z "$PUBLISH" ] || [ "$PUBLISH" == "false" ] || [ "$PUBLISH" == "null" ]; then
                continue
              fi
              PACKAGES="$PACKAGES{\"package\":\"$NAME\",\"path\":\"$path\"},"
            fi
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT

  publish-image:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.docker != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.release.outputs.docker) }}
    uses: ./.github/workflows/docker.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      tags: ${{ matrix.tags }}
      image: ${{ matrix.image }}
      license-scan: false
      downstream: https://api.github.com/repos/infitx-org/profile-cd/actions/workflows/docker-image.yaml/dispatches
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TRIGGER_DOWNSTREAM: ${{ secrets.TRIGGER_DOWNSTREAM }}

  setup-node:
    needs: release
    if: needs.release.outputs.released == 'true' && needs.release.outputs.npm != '[]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - &node
        name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - &cache
        name: cache pnpm store
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - &unpack
        name: Unpack the pnpm store
        # The archive holds the store as one `deps.tar.zst`, so it has to be unpacked
        # before an install can use it. `zstd` piped into `tar` rather than `tar --zstd`,
        # so the step does not depend on how the runner's tar was built, and an archive
        # from an older key holds the tree instead — a missing tarball is not an error.
        run: |
          if [ -f common/temp/deps.tar.zst ]; then
            zstd -dc common/temp/deps.tar.zst | tar -xf - -C .
          else
            echo 'No deps.tar.zst in the restored archive; the install builds the store.'
          fi
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
      - name: Pack the pnpm store
        run: |
          if [ -d common/temp/pnpm-store ]; then
            tar -cf - common/temp/pnpm-store | zstd -3 -T0 -q -f -o common/temp/deps.tar.zst
            ls -l common/temp/deps.tar.zst
          else
            echo 'No pnpm store at common/temp/pnpm-store; nothing to pack.'
          fi

  publish-package:
    needs:
      - release
      - setup-node
    strategy:
      matrix:
        include: ${{ fromJson(needs.release.outputs.npm) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - *node
      # `&cache-restore` is the anchor the jobs that do not build use. Only a job
      # that runs `rush rebuild` may write the shared pnpm key: its archive is the
      # one carrying every `*/dist`. A job that only installs and then saves wins
      # the race with a build-less archive of its own, and since an exact cache hit
      # suppresses saving, that archive is then handed to every later run falling
      # back to the default branch — `rush.yaml`'s test job never builds, so it is
      # the first to break (`@feasibleone/blong/dist/types.js` not found).
      - &cache-restore
        name: cache pnpm store (restore only)
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Fail if cache not hit
        if: steps.cache.outputs.cache-hit != 'true'
        run: exit 1
      - *unpack
      - name: Run publish script ${{ matrix.package }}
        run: |
          node common/scripts/install-run-rush.js install
          cd ${{ matrix.path }}
          npm run ci-publish
        id: publish
      # optionally publish to GitHub Pages if the publish script outputs a pages path
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.publish.outputs.pages
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ matrix.path }}/${{steps.publish.outputs.pages}}

  chromatic:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-26.04
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: main
      CHROMATIC_SHA: ${{ github.sha }}
      CHROMATIC_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - *node
      # Restore only: this job never builds, so its filesystem must not become the
      # cache for a key the test jobs read (see the anchor in `publish-package`).
      - *cache-restore
      - *unpack
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Chromatic Storybook baseline
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: node common/scripts/install-run-rush.js ci-chromatic
