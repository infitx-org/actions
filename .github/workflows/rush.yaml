name: Rush CI Workflow
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
      history-files:
        required: false
        type: string
        default: '+(app|core|ext|library)/*/.allure/history.jsonl'
      history-gist-id:
        required: false
        type: string
        default: ''
      reports-repository:
        required: false
        type: string
        default: ${{ github.repository }}-ci
      ci-test-jobs:
        required: false
        type: string
        default: max
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false
      BLONG_MASTER_KEY:
        required: false
      REPORT_TOKEN:
        required: false
      HISTORY_TOKEN:
        required: false
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chromatic: ${{ steps.config.outputs.chromatic }}
      integration: ${{ steps.config.outputs.integration }}
      playwright: ${{ steps.config.outputs.playwright }}
      ci-diagnostics: ${{ steps.config.outputs.ci-diagnostics }}
    steps:
      - uses: actions/checkout@v6
      - &node
        name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - &cache
        name: cache pnpm store
        uses: actions/cache@v5
        with:
          path: |
            common/temp
            app/**/node_modules
            app/*/dist
            app/*/.rush
            core/**/node_modules
            core/*/dist
            core/*/.rush
            ext/**/node_modules
            ext/*/dist
            ext/*/.rush
            library/**/node_modules
            library/*/dist
            library/*/.rush
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
      - name: Config check
        id: config
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "chromatic=" >> $GITHUB_OUTPUT
          else
            echo "chromatic=true" >> $GITHUB_OUTPUT
          fi
          if [ -f ./test/integration/kustomization.yaml ]; then
            echo "integration=true" >> $GITHUB_OUTPUT
          else
            echo "integration=" >> $GITHUB_OUTPUT
          fi
          if [ -f ./test/integration/ci-diagnostics.sh ]; then
            echo "ci-diagnostics=true" >> $GITHUB_OUTPUT
          else
            echo "ci-diagnostics=" >> $GITHUB_OUTPUT
          fi
          echo "playwright=$(find . -path '*/node_modules/.bin/playwright' -print -quit 2>/dev/null)" >> $GITHUB_OUTPUT
  tests:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      reports: ${{ steps.result.outputs.reports }}
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        if: needs.setup.outputs.playwright != ''
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Install Playwright
        id: pw-install
        if: needs.setup.outputs.playwright != ''
        run: |
          ${{ needs.setup.outputs.playwright }} install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            "${{ needs.setup.outputs.playwright }}" install chromium
          fi
      - name: Sync History
        uses: gacts/run-and-post-run@v1
        if: ${{ inputs.history-gist-id != '' }}
        env:
          GH_TOKEN: ${{ secrets.HISTORY_TOKEN }}
        with:
          run: |
            files=$(gh gist view ${{ inputs.history-gist-id }} --files)
            for file in $files; do
              gh gist view ${{ inputs.history-gist-id }} --filename "${file//__//\}" > "$file"
            done
          post: |
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull request detected, skipping history sync."
              exit 0
            fi
            shopt -s globstar extglob nullglob
            for file in ${{ inputs.history-files }}; do
              gh gist edit ${{ inputs.history-gist-id }} --filename "${file//\//__}" "$file"
            done
      - uses: AbsaOSS/k3d-action@v2
        if: needs.setup.outputs.integration == 'true'
        with:
          cluster-name: cluster
          k3d-version: v5.8.3
          args: >-
            -p "8200:30002@agent:0:direct"
            -p "3306:30006@agent:0:direct"
            -p "9000:30009@agent:0:direct"
            -p "8180:30080@agent:0:direct"
            -p "9092:30092@agent:0:direct"
            -p "27017:30017@agent:0:direct"
            -p "6379:30063@agent:0:direct"
            --agents 1
            --no-lb
            --k3s-arg "--disable=traefik,servicelb,metrics-server@server:*"
      - name: Deploy services
        if: needs.setup.outputs.integration == 'true'
        run: kubectl apply -k test/integration/

      - name: Run Tests
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node common/scripts/install-run-rush.js ci-test --parallelism=${{ inputs.ci-test-jobs }} --verbose # --to git:origin/${{ github.event.pull_request.base.ref }}
        env:
          BLONG_MASTER_KEY: ${{ secrets.BLONG_MASTER_KEY }}
          PLAYWRIGHT_SKIP_INSTALL: '1'
      - name: Collect CI failure diagnostics (k8s + MySQL)
        if: ${{ failure() && needs.setup.outputs.ci-diagnostics == 'true' }}
        run: bash test/integration/ci-diagnostics.sh
      - name: Upload CI failure diagnostics
        if: ${{ failure() && needs.setup.outputs.ci-diagnostics == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: ci-debug/
          if-no-files-found: ignore
      - run: node common/scripts/install-run-rush.js ci-coverage # --verbose --to git:origin/${{ github.event.pull_request.base.ref }}
        env:
          BLONG_MASTER_KEY: ${{ secrets.BLONG_MASTER_KEY }}
        name: Run coverage reports
      - id: check-report
        run: |
          if ls **/coverage/junit.xml 1> /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Assemble report data
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mkdir -p report-data
          # Per-package summaries, one <pkg>.md each: Playwright/Allure suites
          # write allure-report/summary.md; vitest suites (e.g. blong-browser)
          # drop a vitest-report/summary.md in their package root.
          for summary in {app,core,ext,library}/*/allure-report/summary.md \
                         {app,core,ext,library}/*/vitest-report/summary.md; do
            pkg="$(basename "$(dirname "$(dirname "$summary")")")"
            cp "$summary" "report-data/${pkg}.md"
          done
          # Root coverage lcov produced by ci-coverage (aggregated per package).
          if [ -f coverage/lcov.info ]; then
            cp coverage/lcov.info report-data/coverage.lcov
          fi
      - name: Publish test results (check run only)
        if: ${{ steps.check-report.outputs.exists == 'true' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/coverage/junit.xml
          check_run: true
          comment_mode: off
          job_summary: false
          json_file: report-data/test-results.json
      - name: List reports
        id: result
        if: ${{ !cancelled() }}
        run: |
          shopt -s globstar extglob nullglob
          REPORTS="["
          for file in +(app|core|ext|library)/*/allure-report +(app|core|ext|library)/*/coverage*/lcov-report coverage*/lcov-report allure-report*; do
            REPORTS="$REPORTS{\"report\":\"${file}\",\"package\":\"$(basename $(dirname $file))\"},"
          done
          REPORTS="${REPORTS%,}]"
          echo "reports=$REPORTS" >> $GITHUB_OUTPUT
      - name: Upload report data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-data
          path: report-data/
          if-no-files-found: ignore
      - name: upload reports
        if: ${{ !cancelled() && steps.result.outputs.reports != '[]' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/*/allure-report
            app/*/coverage*/lcov-report
            app/*/test/**/*.play.ts-snapshots/
            app/*/.playwright/results/
            app/*/allure-report/traces/
            core/*/allure-report
            core/*/coverage*/lcov-report
            core/*/test/**/*.play.ts-snapshots/
            core/*/.playwright/results/
            core/*/allure-report/traces/
            ext/*/allure-report
            ext/*/coverage*/lcov-report
            ext/*/test/**/*.play.ts-snapshots/
            ext/*/.playwright/results/
            ext/*/allure-report/traces/
            library/*/allure-report
            library/*/coverage*/lcov-report
            coverage*/lcov-report
            allure-report*
      - name: Fail job when tests failed
        if: ${{ steps.test.outcome == 'failure' }}
        run: exit 1

  publish-report:
    needs:
      - tests
    if: ${{ !cancelled() && needs.tests.outputs.reports != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.tests.outputs.reports) }}
      max-parallel: 1
    runs-on: ubuntu-latest
    steps:
      - name: Download Report
        uses: actions/download-artifact@v8
        with:
          name: reports
      - name: Deploy Reports to GitHub Pages
        id: deploy
        shell: bash
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          EXT_REPO: ${{ inputs.reports-repository }}
          TOOL: ${{ matrix.package }}
          RUN_NUM: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REPORT_SRC: ${{ matrix.report }}
          KEEP_REPORTS: '15'
        run: |
          set -euo pipefail
          if [ "$EXT_REPO" = "$GITHUB_REPOSITORY" ]; then
            TOKEN="$GITHUB_TOKEN"
          else
            TOKEN="${REPORT_TOKEN:-}"
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::No token available to publish to $EXT_REPO (set REPORT_TOKEN for an external reports repo) — skipping deploy"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          owner="${EXT_REPO%%/*}"
          extname="${EXT_REPO##*/}"
          pages_branch="gh-pages"
          auth_url="https://x-access-token:${TOKEN}@github.com/${EXT_REPO}.git"
          work="$RUNNER_TEMP/publish-${TOOL}"
          rm -rf "$work"
          if git ls-remote --heads "$auth_url" "$pages_branch" >/dev/null 2>&1; then
            git clone -q --depth 1 --branch "$pages_branch" "$auth_url" "$work"
          else
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" checkout -q -b "$pages_branch"
          fi
          cd "$work"
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git config pull.rebase false

          # Stage this run's report under docs/<tool>/<workflow>/<run> — keeps
          # the existing Pages layout (site root is /docs) so old URLs survive.
          wf="${WORKFLOW// /-}"
          run_dir="docs/${TOOL}/${wf}/${RUN_NUM}"
          mkdir -p "$run_dir"
          src="${GITHUB_WORKSPACE}/${REPORT_SRC}"
          if [ -d "$src" ]; then
            cp -a "$src/." "$run_dir/"
          else
            echo "::warning::report source not found: $REPORT_SRC"
          fi
          touch docs/.nojekyll

          # Prune the oldest run directories for this tool beyond KEEP_REPORTS.
          root="docs/${TOOL}/${wf}"
          mapfile -t old_runs < <(find "$root" -mindepth 1 -maxdepth 1 -type d \
            -regextype posix-extended -regex '.*/[0-9]+' 2>/dev/null | sort -V)
          total="${#old_runs[@]}"
          if [ "$total" -gt "$KEEP_REPORTS" ]; then
            del=$((total - KEEP_REPORTS))
            for ((i = 0; i < del; i++)); do rm -rf "${old_runs[$i]}"; done
          fi

          # Regenerate a simple directory index at each level.
          gen_index() {
            local d="$1" title="$2" s
            local -a subs
            mapfile -t subs < <(find "$d" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort -V)
            {
              printf '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>%s</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><h1>%s</h1><ul>\n' "$title" "$title"
              for s in "${subs[@]}"; do printf '<li><a href="%s/">%s</a></li>\n' "$s" "$s"; done
              printf '</ul></body></html>\n'
            } > "$d/index.html"
          }
          gen_index "docs/${TOOL}/${wf}" "${TOOL} — ${wf}"
          gen_index "docs/${TOOL}" "${TOOL} reports"
          gen_index "docs" "Reports"

          # Commit + force push (keeps the gh-pages branch shallow).
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "report(${TOOL}): ${wf} run ${RUN_NUM}"
            git push -q --force "$auth_url" "HEAD:${pages_branch}"
          fi

          # Resolve the base URL (custom-domain aware), fall back to github.io.
          base=""
          if command -v gh >/dev/null 2>&1; then
            base="$(GH_TOKEN="$TOKEN" gh api "/repos/${EXT_REPO}/pages" --jq '.html_url' 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || [[ "$base" != http* ]]; then
            base="https://${owner}.github.io/${extname}"
          fi
          base="${base%/}"
          url="${base}/${TOOL}/${wf}/${RUN_NUM}/"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          mkdir -p "${GITHUB_WORKSPACE}/report-urls"
          printf '%s' "$url" > "${GITHUB_WORKSPACE}/report-urls/${TOOL}.txt"
      - name: Upload report URL
        if: ${{ steps.deploy.outputs.deployed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: report-urls
          path: report-urls/
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    needs: [tests, publish-report]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download report data
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: report-data
        continue-on-error: true
      - name: Download report URLs
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: report-urls
        continue-on-error: true
      - name: Render consolidated report
        id: render
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/render-report.mjs" <<'RENDER_EOF'
          import {existsSync, readdirSync, readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const dataDir = 'report-data';
          const urlsDir = 'report-urls';
          const urls = new Map();
          if (existsSync(urlsDir)) {
            for (const f of readdirSync(urlsDir)) {
              if (f.endsWith('.txt')) {
                urls.set(f.replace(/\.txt$/, ''), readFileSync(join(urlsDir, f), 'utf8').trim());
              }
            }
          }
          const rows = [];
          if (existsSync(dataDir)) {
            for (const f of readdirSync(dataDir).filter((x) => x.endsWith('.md'))) {
              const pkg = f.replace(/\.md$/, '');
              const head = readFileSync(join(dataDir, f), 'utf8').split('\n').find((l) => l.startsWith('### ')) ?? '';
              const body = head.includes('\u2014') ? head.slice(head.indexOf('\u2014') + 1) : '';
              const num = (re) => { const m = body.match(re); return m ? Number(m[1]) : 0; };
              const passed = num(/(\d+) passed/);
              const failed = num(/(\d+) failed/);
              const flaky = num(/(\d+) flaky/);
              const total = num(/\((\d+) total\)/);
              if (body) rows.push({pkg, passed, failed, flaky, total});
            }
            rows.sort((a, b) => (b.failed + b.flaky) - (a.failed + a.flaky) || a.pkg.localeCompare(b.pkg));
          }
          const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
          const lines = [];
          if (rows.length > 0) {
            lines.push('## CI Summary');
            lines.push('');
            const extra = sum('flaky') > 0 ? `, ${sum('flaky')} flaky` : '';
            lines.push(`**${rows.length} package(s) · ${sum('passed')} passed, ${sum('failed')} failed${extra} (${sum('total')} total)** — build #${process.env.GITHUB_RUN_NUMBER}`);
            lines.push('');
            lines.push('| Package | Result | Passed | Failed | Flaky | Total | Report |');
            lines.push('| --- | --- | ---: | ---: | ---: | ---: | --- |');
            for (const r of rows) {
              const icon = r.failed > 0 ? '\u274c' : r.flaky > 0 ? '\u26a0\ufe0f' : '\u2705';
              const link = urls.get(r.pkg) ? `[report](${urls.get(r.pkg)})` : '\u2014';
              lines.push(`| ${r.pkg} | ${icon} | ${r.passed} | ${r.failed} | ${r.flaky} | ${r.total} | ${link} |`);
            }
            lines.push('');
          }
          const cov = new Map();
          if (existsSync(join(dataDir, 'coverage.lcov'))) {
            let cur = null;
            for (const line of readFileSync(join(dataDir, 'coverage.lcov'), 'utf8').split('\n')) {
              if (line.startsWith('SF:')) {
                const p = line.slice(3).split('/');
                cur = (p[0] === 'core' || p[0] === 'ext' || p[0] === 'app' || p[0] === 'library') ? p[1] : p[0];
                if (!cov.has(cur)) cov.set(cur, {found: 0, hit: 0});
              } else if (line.startsWith('LF:')) {
                cov.get(cur).found += Number(line.slice(3));
              } else if (line.startsWith('LH:')) {
                cov.get(cur).hit += Number(line.slice(3));
              }
            }
          }
          if (cov.size > 0) {
            const crows = [...cov.entries()]
              .map(([p, v]) => [p, v.hit, v.found, v.found > 0 ? Math.round((v.hit / v.found) * 100) : 0])
              .sort((a, b) => b[3] - a[3]);
            lines.push('### Coverage');
            lines.push('');
            lines.push('| Package | Lines hit / total | Coverage |');
            lines.push('| --- | ---: | ---: |');
            for (const [p, hit, found, pct] of crows) {
              lines.push(`| ${p} | ${hit} / ${found} | ${pct}% |`);
            }
            lines.push('');
          }
          if (rows.length > 0 || cov.size > 0) {
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            lines.push(`_See the [full run](${runUrl}) for job logs._`);
          }
          console.log(lines.join('\n'));
          RENDER_EOF
          node "$RUNNER_TEMP/render-report.mjs" > "$RUNNER_TEMP/ci-report.md"
          if [ -s "$RUNNER_TEMP/ci-report.md" ]; then
            echo "nonempty=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/ci-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "nonempty=false" >> "$GITHUB_OUTPUT"
          fi
          echo "file=$RUNNER_TEMP/ci-report.md" >> "$GITHUB_OUTPUT"
      - name: Clean up superseded report comments
        if: ${{ github.event_name == 'pull_request' && needs.publish-report.result != 'skipped' }}
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.issue.number;
            if (!pr) return;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number: pr});
            for (const c of comments) {
              const bot = c.user && c.user.type === 'Bot';
              if (bot && /📊 .*report published at/.test(c.body || '')) {
                await github.rest.issues.deleteComment({owner, repo, comment_id: c.id});
              }
            }
      - name: Post consolidated report comment
        if: ${{ github.event_name == 'pull_request' && steps.render.outputs.nonempty == 'true' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-report
          path: ${{ steps.render.outputs.file }}
          ignore_empty: true

  chromatic:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.chromatic
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
      CHROMATIC_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-chromatic --to git:origin/${{ github.event.pull_request.base.ref }}
        name: Chromatic Storybook
  audit:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-audit
        name: Audit Check for dependencies
      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: '**/audit/auditResults.json'

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-lint
        name: Lint Check

  deprecation:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-deprecation
        name: Check for Deprecated dependencies

  changes:
    runs-on: ubuntu-latest
    # Required permissions
    outputs:
      # Expose matched filters as job 'packages' output variable
      changes: ${{ steps.result.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: List Dockerfiles
        id: docker-files
        run: |
          shopt -s nullglob globstar extglob
          echo -e "filters<<EOF" >> $GITHUB_OUTPUT
          for file in app/**/*Dockerfile; do
            echo "$file: ${file%${file#*/*/}}package.json" >> $GITHUB_OUTPUT
          done
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.docker-files.outputs.filters != ''
        name: Filter changes
        with:
          filters: ${{ steps.docker-files.outputs.filters }}
      - name: Convert changes to JSON
        id: result
        if: steps.filter.outputs.changes != ''
        run: |
          PACKAGES="["
          for file in ${{ join(fromJson(steps.filter.outputs.changes), ' ') }}; do
            PACKAGES="$PACKAGES{\"dockerfile\":\"$file\",\"image\":\"$(basename $file | cut -d'.' -f1)\"},"
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT

  build:
    needs: changes
    if: needs.changes.outputs.changes != ''
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.changes) }}
    uses: ./.github/workflows/docker.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      license-scan: false
      downstream: https://api.github.com/repos/infitx-org/profile-cd/actions/workflows/docker-image.yaml/dispatches
