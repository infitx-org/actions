name: Rush CI Workflow
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.x'
      reports-repository:
        required: false
        type: string
        default: ${{ github.repository }}-ci
      ci-test-jobs:
        required: false
        type: string
        default: max
      ci-test-verbose:
        description: Stream every project's output instead of only the failing ones.
        required: false
        type: boolean
        default: false
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: false
      BLONG_MASTER_KEY:
        required: false
      REPORT_TOKEN:
        required: false
jobs:
  setup:
    runs-on: ubuntu-26.04
    outputs:
      chromatic: ${{ steps.config.outputs.chromatic }}
      integration: ${{ steps.config.outputs.integration }}
      playwright: ${{ steps.config.outputs.playwright }}
      ci-diagnostics: ${{ steps.config.outputs.ci-diagnostics }}
    steps:
      - uses: actions/checkout@v6
      - &node
        name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - &cache
        name: cache pnpm store
        # Only the `setup` job may write this key: it is the job that runs
        # `rush rebuild`, so its archive is the one carrying every `*/dist`. The
        # jobs below restore the same key without building, and an exact hit
        # suppresses saving, so a build-less writer elsewhere (see
        # `release-docker.yaml`, where a job saved before the builder did) leaves
        # the test job without `@feasibleone/blong/dist/types.js` and takes every
        # package that imports it down with it.
        uses: actions/cache@v5
        with:
          path: |
            common/temp
            app/**/node_modules
            app/*/dist
            app/*/.rush
            core/**/node_modules
            core/*/dist
            core/*/.rush
            realm/**/node_modules
            realm/*/dist
            realm/*/.rush
            suite/**/node_modules
            suite/*/dist
            suite/*/.rush
            demo/**/node_modules
            demo/*/dist
            demo/*/.rush
            test/**/node_modules
            test/*/dist
            test/*/.rush
            tools/**/node_modules
            tools/*/dist
            tools/*/.rush
            ext/**/node_modules
            ext/*/dist
            ext/*/.rush
            library/**/node_modules
            library/*/dist
            library/*/.rush
            # The docs project's `node_modules` is deliberately not cached: it is the
            # one project no job in this workflow builds or tests, and its tree is
            # installed by npm rather than through the pnpm store (hundreds of real
            # megabytes restored by every job that only needs `common/temp`). Its
            # `.rush` does have to be here — Rush reads the per-project
            # `.rush/temp/shrinkwrap-deps.json` when it calculates the repo state, and
            # a job that restores `common/temp` without it reports "A project
            # dependency file … is missing" and then runs without diffing or caching.
            docs/*/.rush
          key: ${{ runner.os }}-pnpm-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install
      - name: Rush rebuild
        run: node common/scripts/install-run-rush.js rebuild --verbose
      - name: Config check
        id: config
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "chromatic=" >> $GITHUB_OUTPUT
          else
            echo "chromatic=true" >> $GITHUB_OUTPUT
          fi
          if [ -f ./test/integration/kustomization.yaml ]; then
            echo "integration=true" >> $GITHUB_OUTPUT
          else
            echo "integration=" >> $GITHUB_OUTPUT
          fi
          if [ -f ./test/integration/ci-diagnostics.sh ]; then
            echo "ci-diagnostics=true" >> $GITHUB_OUTPUT
          else
            echo "ci-diagnostics=" >> $GITHUB_OUTPUT
          fi
          echo "playwright=$(find . -path '*/node_modules/.bin/playwright' -print -quit 2>/dev/null)" >> $GITHUB_OUTPUT
  tests:
    runs-on: ubuntu-26.04
    needs: setup
    outputs:
      reports: ${{ steps.result.outputs.reports }}
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        if: needs.setup.outputs.playwright != ''
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}
      - name: Install Playwright
        id: pw-install
        # A head start, not the guarantee. The system libraries are the part that needs
        # root, so installing them here — once, before any package runs — is what keeps the
        # packages from fighting over the package-manager lock. The browsers themselves are
        # per-Playwright-version (`~/.cache/ms-playwright/chromium-<revision>`), and this
        # step can only install the ones belonging to the copy `find` happened to return,
        # so each package's leg installs its own before it runs (`blong-dev playwright`,
        # `blong-dev browsers`). Installing here as well is what makes a warm cache enough
        # for most runs.
        if: needs.setup.outputs.playwright != ''
        run: |
          ${{ needs.setup.outputs.playwright }} install-deps chromium
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            "${{ needs.setup.outputs.playwright }}" install chromium
          fi
      - uses: AbsaOSS/k3d-action@v2
        if: needs.setup.outputs.integration == 'true'
        with:
          cluster-name: cluster
          k3d-version: v5.8.3
          args: >-
            -p "8200:30002@agent:0:direct"
            -p "3306:30006@agent:0:direct"
            -p "9000:30009@agent:0:direct"
            -p "8180:30080@agent:0:direct"
            -p "9092:30092@agent:0:direct"
            -p "27017:30017@agent:0:direct"
            -p "6379:30063@agent:0:direct"
            --agents 1
            --no-lb
            --k3s-arg "--disable=traefik,servicelb,metrics-server@server:*"
      - name: Deploy services
        if: needs.setup.outputs.integration == 'true'
        run: kubectl apply -k test/integration/

      # Resolved before the tests, not after them: a package's own report is rendered
      # by the run that produces it, and it links each Playwright trace to
      # `trace.playwright.dev`, which needs the URL the archive will have once it is
      # published. Falls back to the default Pages URL when the reports repository has
      # no Pages site or no token is available to read it.
      - name: Resolve the reports base URL
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          repo="${{ inputs.reports-repository }}"
          base="$(gh api "/repos/${repo}/pages" --jq .html_url 2>/dev/null || true)"
          if [ -z "$base" ]; then
            base="https://${repo%%/*}.github.io/${repo##*/}"
          fi
          echo "CI_REPORTS_BASE=${base%/}" >> "$GITHUB_ENV"
      - name: Run Tests
        id: test
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Without --verbose Rush buffers each project and prints only the failing
        # ones; the full per-package output is kept in .ci-report/ and uploaded as
        # an artifact, and the aggregated report comes from `rush ci-report`.
        # Pass ci-test-verbose: true to stream everything again.
        run: node common/scripts/install-run-rush.js ci-test --parallelism=${{ inputs.ci-test-jobs }} ${{ inputs.ci-test-verbose && '--verbose' || '' }}
        env:
          BLONG_MASTER_KEY: ${{ secrets.BLONG_MASTER_KEY }}
          # Says "do not install system libraries from a test process" — `--with-deps` needs
          # root and the step above already ran it. It no longer means "do not install
          # browsers": a leg whose Chromium revision is missing installs it (no root needed),
          # because the alternative is the run dying with "Executable doesn't exist at …".
          PLAYWRIGHT_SKIP_INSTALL: '1'
      - name: Collect CI failure diagnostics (k8s + MySQL)
        if: ${{ steps.test.outcome == 'failure' && needs.setup.outputs.ci-diagnostics == 'true' }}
        run: bash test/integration/ci-diagnostics.sh
      - name: Upload CI failure diagnostics
        if: ${{ steps.test.outcome == 'failure' && needs.setup.outputs.ci-diagnostics == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics
          path: ci-debug/
          if-no-files-found: ignore
      - run: node common/scripts/install-run-rush.js ci-coverage # --verbose --to git:origin/${{ github.event.pull_request.base.ref }}
        env:
          BLONG_MASTER_KEY: ${{ secrets.BLONG_MASTER_KEY }}
        name: Run coverage reports
      - name: Fetch metrics baseline
        if: ${{ !cancelled() && github.base_ref != '' }}
        continue-on-error: true
        # The report's deltas, the metrics rebuild and the history rebuild are all
        # anchored to the base branch, never to what this branch currently holds,
        # so repeated runs of one pull request cannot accumulate data.
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          for pair in metrics.json:.github/metrics.json history.jsonl:.github/history.jsonl; do
            target="${pair%%:*}"
            source="${pair#*:}"
            git show "FETCH_HEAD:${source}" > "$RUNNER_TEMP/baseline/${target}" 2>/dev/null || : > "$RUNNER_TEMP/baseline/${target}"
          done
          echo "CI_BASE_METRICS=$RUNNER_TEMP/baseline/metrics.json" >> "$GITHUB_ENV"
          echo "CI_BASE_HISTORY=$RUNNER_TEMP/baseline/history.jsonl" >> "$GITHUB_ENV"
      - name: Build CI report
        if: ${{ !cancelled() }}
        # Repo-owned hook: aggregates every package's `.ci-report/`, renders
        # ci-report.md (action summary + PR comment), writes the metrics snapshot,
        # rebuilds .github/metrics.json + .github/history.jsonl from the base
        # branch and builds the failures bundle. Repositories without a `ci-report`
        # script skip this silently.
        run: node common/scripts/install-run-rush.js ci-report
        env:
          BLONG_MASTER_KEY: ${{ secrets.BLONG_MASTER_KEY }}
      - name: Stack metrics and history onto the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # The two baseline files land on a `metrics/<branch>` branch of their own,
        # with a pull request from there onto the branch under test: committing
        # them onto that branch would make a skipped commit its tip and hide the
        # checks of the commit that was actually tested. Pushed with the workflow
        # token, whose events start no run. The caller's job therefore needs
        # contents:write and pull-requests:write.
        uses: infitx-org/actions/.github/actions/commit-metrics@main
        with:
          metrics-file: .github/metrics.json
          history-file: .github/history.jsonl
          token: ${{ github.token }}
      - name: List reports
        id: result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          REPORTS="["
          # Explicit category globs (rather than +(...) extglob, which depends on
          # shopt running before the line is parsed). The list is the only input of
          # the publish job, which copies every entry and pushes once.
          for dir in app/*/.ci-report/publish core/*/.ci-report/publish ext/*/.ci-report/publish \
                     library/*/.ci-report/publish realm/*/.ci-report/publish suite/*/.ci-report/publish \
                     demo/*/.ci-report/publish test/*/.ci-report/publish tools/*/.ci-report/publish; do
            tool="$(basename "$(dirname "$(dirname "${dir}")")")"
            REPORTS="$REPORTS{\"tool\":\"${tool}\",\"src\":\"${dir}\"},"
          done
          if [ -d ci-failures/publish ]; then
            REPORTS="$REPORTS{\"tool\":\"failures\",\"src\":\"ci-failures/publish\"},"
          fi
          if [ -d coverage/lcov-report ]; then
            REPORTS="$REPORTS{\"tool\":\"coverage\",\"src\":\"coverage/lcov-report\"},"
          fi
          REPORTS="${REPORTS%,}]"
          echo "reports=$REPORTS" >> $GITHUB_OUTPUT
      - name: Upload CI summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-report
          path: ci-report.md
          if-no-files-found: ignore
      - name: Upload metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: metrics.json
          if-no-files-found: ignore
      - name: upload reports
        if: ${{ !cancelled() && steps.result.outputs.reports != '[]' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # `.ci-report` and `.playwright` start with a dot, and upload-artifact
          # drops hidden files — including every file inside a hidden folder —
          # unless this is set. Without it the artifact is empty of reports and the
          # publish job warns that every report source is missing.
          include-hidden-files: true
          path: |
            app/*/.ci-report
            app/*/coverage*/lcov-report
            app/*/test/**/*.play.ts-snapshots/
            app/*/.playwright/results/
            core/*/.ci-report
            core/*/coverage*/lcov-report
            core/*/test/**/*.play.ts-snapshots/
            core/*/.playwright/results/
            realm/*/.ci-report
            realm/*/coverage*/lcov-report
            realm/*/test/**/*.play.ts-snapshots/
            realm/*/.playwright/results/
            suite/*/.ci-report
            suite/*/coverage*/lcov-report
            suite/*/test/**/*.play.ts-snapshots/
            suite/*/.playwright/results/
            demo/*/.ci-report
            demo/*/coverage*/lcov-report
            demo/*/test/**/*.play.ts-snapshots/
            demo/*/.playwright/results/
            test/*/.ci-report
            test/*/coverage*/lcov-report
            test/*/test/**/*.play.ts-snapshots/
            test/*/.playwright/results/
            tools/*/.ci-report
            tools/*/coverage*/lcov-report
            tools/*/test/**/*.play.ts-snapshots/
            tools/*/.playwright/results/
            ext/*/.ci-report
            ext/*/coverage*/lcov-report
            ext/*/test/**/*.play.ts-snapshots/
            ext/*/.playwright/results/
            library/*/.ci-report
            library/*/coverage*/lcov-report
            coverage*/lcov-report
            ci-failures
      - name: Fail job when tests failed
        if: ${{ steps.test.outcome == 'failure' }}
        run: exit 1

  publish-report:
    needs:
      - tests
    # '' when the tests job never ran (its outputs are then empty), '[]' when the
    # run produced nothing to publish.
    if: ${{ !cancelled() && needs.tests.outputs.reports != '' && needs.tests.outputs.reports != '[]' }}
    runs-on: ubuntu-26.04
    steps:
      - *node
      - name: Download Reports
        uses: actions/download-artifact@v8
        with:
          name: reports
      - name: Deploy Reports to GitHub Pages
        id: deploy
        # One job for the whole run, and one push with it. A matrix entry per
        # report cloned, committed and force-pushed the branch once per report, and
        # every push to it cancels the Pages build the previous push started — the
        # reports all land in a single commit here instead.
        uses: infitx-org/actions/.github/actions/deploy-report@main
        with:
          report-token: ${{ secrets.REPORT_TOKEN }}
          ext-repo: ${{ inputs.reports-repository }}
          run-num: ${{ github.run_number }}
          workflow: ${{ github.workflow }}
          reports: ${{ needs.tests.outputs.reports }}
          keep-reports: '15'
          # The failures bundle also answers on a stable URL, so an agent can be
          # pointed at `<tool>/<workflow>/latest/failures.json`. A green run
          # publishes no bundle, and the action drops the alias in the same commit.
          aliases: '{"failures":"latest"}'

  report:
    runs-on: ubuntu-26.04
    needs: [tests, publish-report]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download CI summary
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: ci-report
        continue-on-error: true
      - name: Clean up superseded report comments
        if: ${{ github.event_name == 'pull_request' && needs.publish-report.result != 'skipped' }}
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.issue.number;
            if (!pr) return;
            // The report's own signature, not a phrase from an older renderer: the
            // document `rush ci-report` renders starts with the `## CI Summary`
            // heading, and the stub below posts it after this step, so a match here
            // can only be a report left by an earlier run (or by a tool that posted
            // one under a different sticky header). The `report published at`
            // alternative is the line the workflow's own wrapper used to add before
            // the rendering moved into `rush ci-report`, kept so comments carrying
            // it are still cleaned up.
            const superseded = /(^|\n)## CI Summary\b|📊 .*report published at/;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number: pr});
            for (const c of comments) {
              const bot = c.user && c.user.type === 'Bot';
              if (bot && superseded.test(c.body || '')) {
                await github.rest.issues.deleteComment({owner, repo, comment_id: c.id});
              }
            }
      - name: Note when no report was produced
        # A repository without the repo-owned `ci-report` hook produces no
        # ci-report.md, and the comment is then left alone; say so instead of
        # skipping silently.
        if: ${{ github.event_name == 'pull_request' && hashFiles('ci-report.md') == '' }}
        run: echo "::notice::No ci-report.md was produced by this run, so the pull-request comment was left unchanged."
      - name: Post consolidated report comment
        # The comment is the same document the run summary shows — it is rendered
        # once by `rush ci-report`, so it already carries the failure-report links
        # and one row per package with its report link.
        if: ${{ github.event_name == 'pull_request' && hashFiles('ci-report.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-report
          path: ci-report.md
          ignore_empty: true

  chromatic:
    runs-on: ubuntu-26.04
    needs: setup
    if: needs.setup.outputs.chromatic
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.ref }}
      CHROMATIC_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-chromatic --to git:origin/${{ github.event.pull_request.base.ref }}
        name: Chromatic Storybook
  audit:
    runs-on: ubuntu-26.04
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-audit
        name: Audit Check for dependencies
      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: '**/audit/auditResults.json'

  lint:
    runs-on: ubuntu-26.04
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-lint
        name: Lint Check
      - name: Memory files check
        # The agent memory files belong to no Rush project, so `rush ci-lint`
        # never sees them: this is the gate for their structure, wrapping,
        # generated index and spelling. Same command the pre-commit hook runs.
        run: node tools/blong-dev/bin/blong-dev.ts memory check

  deprecation:
    runs-on: ubuntu-26.04
    needs: setup
    steps:
      - uses: actions/checkout@v6
      - *node
      - *cache
      - run: node common/scripts/install-run-rush.js ci-deprecation
        name: Check for Deprecated dependencies

  changes:
    runs-on: ubuntu-26.04
    # Required permissions
    outputs:
      # Expose matched filters as job 'packages' output variable
      changes: ${{ steps.result.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: List Dockerfiles
        id: docker-files
        run: |
          shopt -s nullglob globstar extglob
          echo -e "filters<<EOF" >> $GITHUB_OUTPUT
          for file in app/**/*Dockerfile; do
            echo "$file: ${file%${file#*/*/}}package.json" >> $GITHUB_OUTPUT
          done
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.docker-files.outputs.filters != ''
        name: Filter changes
        with:
          filters: ${{ steps.docker-files.outputs.filters }}
      - name: Convert changes to JSON
        id: result
        if: steps.filter.outputs.changes != ''
        run: |
          PACKAGES="["
          for file in ${{ join(fromJson(steps.filter.outputs.changes), ' ') }}; do
            PACKAGES="$PACKAGES{\"dockerfile\":\"$file\",\"image\":\"$(basename $file | cut -d'.' -f1)\"},"
          done
          PACKAGES="${PACKAGES%,}]"
          echo "changes=$PACKAGES" >> $GITHUB_OUTPUT

  build:
    needs: changes
    if: needs.changes.outputs.changes != ''
    strategy:
      matrix:
        include: ${{ fromJson(needs.changes.outputs.changes) }}
    uses: ./.github/workflows/docker.yaml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      license-scan: false
      downstream: https://api.github.com/repos/infitx-org/profile-cd/actions/workflows/docker-image.yaml/dispatches
