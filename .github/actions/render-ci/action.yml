name: Render CI summary and metrics
description: >-
    Parses report-data/ (per-package test summaries + aggregated coverage.lcov),
    diffs test and coverage metrics against the committed .github/metrics.json on
    the PR base branch, writes ci-report.md and metrics.json into the workspace,
    and appends the rendered markdown to the job step summary.
inputs:
    base-ref:
        description: >-
            PR base branch whose .github/metrics.json is the baseline to diff
            against. Empty on push events (no baseline is fetched).
        required: false
        default: ''
runs:
    using: composite
    steps:
        - name: Render CI summary and metrics
          shell: bash
          run: node "${{ github.action_path }}/index.mjs"
          env:
              BASE_REF: ${{ inputs.base-ref }}
