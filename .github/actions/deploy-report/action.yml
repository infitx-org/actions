name: Deploy reports to GitHub Pages
description: >-
    Publishes a run's report directories to the `<reports-repository>` gh-pages
    branch under `docs/<tool>/<workflow>/<run-number>`, regenerates the per-level
    index.html files, prunes old numeric run dirs beyond keep-reports, and
    force-pushes. The whole run goes out in **one commit and one push**: a report
    per invocation would clone, commit and push once per report, and every push to
    the same branch cancels the Pages build the previous push started.

    Aliases are declarative: a tool in `aliases` that reported this run has its
    alias mirrored to the run, and a tool named there that did *not* report has its
    alias dropped in the same commit, so a URL handed to an agent never keeps
    answering with a stale report.

    Emits the published URLs, tool by tool, as the `urls` output.
inputs:
    report-token:
        description: >-
            Token with write access to the external reports repository. Ignored
            when ext-repo equals the current repository (GITHUB_TOKEN is used).
        required: false
        default: ''
    ext-repo:
        description: owner/repo hosting the gh-pages branch (defaults to the current repository).
        required: false
        default: ''
    workflow:
        description: Workflow name used in the docs/<tool>/<workflow>/... path.
        required: true
    run-num:
        description: Current workflow run number (github.run_number). Required unless nothing is published.
        required: false
        default: ''
    reports:
        description: >-
            JSON array of {"tool": "...", "src": "..."} — every entry is copied
            into docs/<tool>/<workflow>/<run-num>, and all of them are committed and
            pushed together. `src` is a workspace-relative path, for example
            `core/blong-browser/.ci-report/publish`.
        required: false
        default: '[]'
    aliases:
        description: >-
            JSON object of {"<tool>": "<alias>"} naming the tools that must answer
            on a stable URL. The alias directory (inside docs/<tool>/<workflow>/)
            mirrors this run when the tool reported, and is removed when it did not.
        required: false
        default: '{}'
    assets:
        description: >-
            JSON array of {"src": "...", "dest": "..."} — directories copied once
            into the site root, at docs/<dest>, instead of into a run directory. They
            hold what every report references but none of them should carry: the
            content-addressed Allure application bundle. `src` is workspace-relative;
            `dest` is relative to the site root. Existing files are overwritten and
            others are kept, because a retained run may still reference an older
            bundle.
        required: false
        default: '[]'
    keep-reports:
        description: Number of most recent numeric run dirs to keep per tool/workflow.
        required: false
        default: '15'
outputs:
    deployed:
        description: >-
            'true' when the run published something, 'false' when it had nothing to
            publish or no token was available.
        value: ${{ steps.deploy.outputs.deployed }}
    urls:
        description: JSON object mapping every published tool to its report URL.
        value: ${{ steps.deploy.outputs.urls }}
runs:
    using: composite
    steps:
        - id: deploy
          name: Deploy reports to GitHub Pages
          shell: bash
          run: node "${{ github.action_path }}/index.mjs"
          env:
              INPUT_REPORT_TOKEN: ${{ inputs.report-token }}
              INPUT_EXT_REPO: ${{ inputs.ext-repo }}
              INPUT_RUN_NUM: ${{ inputs.run-num }}
              INPUT_WORKFLOW: ${{ inputs.workflow }}
              INPUT_REPORTS: ${{ inputs.reports }}
              INPUT_ALIASES: ${{ inputs.aliases }}
              INPUT_ASSETS: ${{ inputs.assets }}
              INPUT_KEEP_REPORTS: ${{ inputs.keep-reports }}
